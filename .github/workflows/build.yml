name: Build blg (VST3, Windows x64)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

env:
  JUCE_TAG: 8.0.8   # any 8.0.x tag

jobs:
  windows-vst3:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Get JUCE
        shell: bash
        run: git clone --depth 1 --branch "$JUCE_TAG" https://github.com/juce-framework/JUCE.git JUCE

      - name: Configure
        run: cmake -B build -A x64

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Upload blg.vst3
        uses: actions/upload-artifact@v4
        with:
          name: blg-vst3-windows-x64
          path: build/blg_artefacts/Release/VST3/
          if-no-files-found: error
